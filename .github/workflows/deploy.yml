name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # If EC2_KNOWN_HOSTS is set, only that exact host key is trusted.
      # If not, fall back to trust-on-first-use (fine, but no MITM protection).
      - name: Pin host key
        env:
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
            echo "HOSTKEY_MODE=yes" >> "$GITHUB_ENV"
          else
            echo "HOSTKEY_MODE=accept-new" >> "$GITHUB_ENV"
          fi

      - name: Build and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_REPO: ${{ secrets.EC2_REPO_PATH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          ssh -o StrictHostKeyChecking="$HOSTKEY_MODE" \
              "$EC2_USER@$EC2_HOST" bash -s -- "$EC2_REPO" "$DEPLOY_BRANCH" <<'REMOTE'
          # Non-interactive SSH skips ~/.bashrc, so load fnm by hand.
          export PATH="$HOME/.local/share/fnm:$HOME/.fnm:$PATH"
          if command -v fnm >/dev/null 2>&1; then
            eval "$(fnm env --shell bash)"
          fi

          set -euo pipefail

          REPO="$1"
          BRANCH="$2"
          BACKUP="$HOME/threadly-dist-backup"

          cd "$REPO"

          PREV=$(git rev-parse HEAD)
          echo "currently deployed: $PREV ($(git log -1 --format=%s))"

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: tracked files on the server were edited by hand."
            echo "A reset would silently discard them. Fix or revert them first:"
            git status --short
            exit 1
          fi

          # Until the restart, any failure puts the source back on the commit
          # that is actually running, so the next deploy records a good PREV.
          PHASE=build
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$PHASE" = build ]; then
              echo "FAILED before restart -- restoring source to $PREV"
              git -C "$REPO" reset --hard "$PREV" || true
            fi
          }
          trap on_exit EXIT

          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          echo "now building $(git rev-parse --short HEAD) ($(git log -1 --format=%s))"

          # Backend reads its .env at runtime; Vite inlines the frontend .env
          # into the bundle at build time. Both must exist.
          for f in apps/http-server-Be/.env apps/react-Fe/.env; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing"
              exit 1
            fi
          done

          command -v pnpm >/dev/null 2>&1 || corepack enable
          pnpm install --frozen-lockfile

          # Vite empties dist/ before building and nginx serves it directly, so
          # keep the previous build aside and put it back if the new one fails.
          build_frontend() {
            rm -rf "$BACKUP"
            if [ -d apps/react-Fe/dist ]; then
              cp -a apps/react-Fe/dist "$BACKUP"
            fi
            if pnpm --filter react-fe build && test -f apps/react-Fe/dist/index.html; then
              rm -rf "$BACKUP"
              return 0
            fi
            echo "frontend build failed"
            if [ -d "$BACKUP" ]; then
              echo "restoring the previous frontend build"
              rm -rf apps/react-Fe/dist
              mv "$BACKUP" apps/react-Fe/dist
            fi
            return 1
          }

          # Build both before restarting anything.
          pnpm --filter http-server-be build
          build_frontend || exit 1

          # Builds passed: from here on, rollback is handled explicitly below.
          PHASE=live

          # The backend resolves .env relative to its working directory.
          cd apps/http-server-Be
          pm2 restart threadly-backend

          if ! curl -fsS --retry 10 --retry-delay 2 --retry-connrefused \
               http://localhost:3004/api/v1/healthcheck; then
            echo ""
            echo "HEALTH CHECK FAILED -- rolling back to $PREV"
            PHASE=rollback
            cd "$REPO"
            git reset --hard "$PREV"
            pnpm install --frozen-lockfile
            pnpm --filter http-server-be build
            build_frontend || echo "WARNING: rollback frontend build failed; keeping the current build."
            cd apps/http-server-Be
            pm2 restart threadly-backend
            pm2 save
            echo "rolled back to $PREV"
            exit 1
          fi

          pm2 save

          echo ""
          echo "DEPLOYED $(git rev-parse --short HEAD) -- $(git log -1 --format=%s)"
          REMOTE

      - name: Summary
        if: always()
        run: echo "Deploy run finished. Check the build/deploy step log for the commit SHA." >> "$GITHUB_STEP_SUMMARY"

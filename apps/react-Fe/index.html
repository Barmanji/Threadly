<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chat-bubble.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threadly</title>
    <script>
      // Apply the stored theme before the first paint.
      //
      // React can't do this: the class has to be on <html> while the document
      // is still being parsed, otherwise a dark-mode visitor gets a full cream
      // flash before the app mounts. The same logic lives in
      // src/context/ThemeContext.tsx — keep the storage key in sync.
      (function () {
        try {
          var stored = localStorage.getItem("threadly-theme");
          var isDark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {
          // Private mode / storage disabled — the default light theme is fine.
        }
      })();
    </script>
  </head>
  <body class="bg-cream text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
